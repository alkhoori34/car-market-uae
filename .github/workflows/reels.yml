name: Build car reels

# Makes the 15 s reels for the daily social posts on GitHub's servers, so they
# no longer depend on the owner's Chrome being open. See scripts/make-reels.mjs.
on:
  schedule:
    - cron: '17 */3 * * *'   # every 3 hours
  workflow_dispatch:
    inputs:
      ids:
        description: 'Listing ids (comma separated), empty = automatic'
        required: false
      max:
        description: 'Max reels this run'
        required: false
        default: '12'
  push:
    branches: [main]
    paths: ['scripts/make-reels.mjs', '.github/workflows/reels.yml']

concurrency:
  group: reels
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  reels:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts
            public/media/reel
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
      - run: |
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i playwright-core@1.48.2
          cp "$GITHUB_WORKSPACE/scripts/make-reels.mjs" /tmp/pw/
      - if: github.event_name == 'push'
        run: sleep 150   # let Cloudflare deploy the new reel page first
      - run: node /tmp/pw/make-reels.mjs
        env:
          IDS: ${{ github.event.inputs.ids }}
          MAX: ${{ github.event_name == 'push' && '2' || github.event.inputs.max || '12' }}
